services:
  db:
    image: postgres:16-alpine
    container_name: atlas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
      - ./schema_onpremise.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-app-api:latest
    container_name: atlas_backend
    restart: unless-stopped
    ports:
      - "54321:54321"
    volumes:
      - ./server.js:/app/server.js:ro
      - ./index.html:/app/index.html:ro
      - ./styles.css:/app/styles.css:ro
      - ./favicon.png:/app/favicon.png:ro
    environment:
      PORT: 54321
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-Nosemeolvida01}
      GUARDIA_PASSWORD: ${GUARDIA_PASSWORD:-guardiatqs01}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  atlas_pgdata: